name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🛠️ Prebuild Android Native Files
        run: npx expo prebuild --platform android --no-install

      - name: 🔨 Build Android Release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
          TAG_OR_VER="${{ github.event.release.tag_name || 'v1.0.3' }}"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/PriceBook-${TAG_OR_VER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/PriceBook-latest.apk"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriceBook-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: 🚀 Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ${{ github.event.release.tag_name || 'v1.0.3' }}
          files: |
            android/app/build/outputs/apk/release/PriceBook-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
